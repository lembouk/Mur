<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a24">
<title>Murder Party</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept : une nuit, une lampe. Fond pétrole, une seule lumière,
   personnages présentés comme des porte-clés d'hôtel, horloge arrêtée à l'heure du crime. */
:root{
  color-scheme: dark;
  --night:#0b1a24;
  --night-2:#112636;
  --night-3:#18344a;
  --line:#254357;
  --text:#e9eff1;
  --muted:#93abb8;
  --lamp:#f4c25b;
  --lamp-ink:#2a1d02;
  --blood:#ff7a7a;
  --blood-bg:#3a1822;
  --ok:#63d6a4;
  --ok-bg:#0f3427;
  --f-display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0b1a24}
[hidden]{display:none!important}
body{
  margin:0;background:var(--night);color:var(--text);
  font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,p,dl,dd,dt,ul,ol{margin:0}
ul,ol{padding:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:14px 4px}
.brand,.gametag,.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gametag{letter-spacing:.08em;text-align:right}

.tab{display:none;padding-block:12px 24px}
.tab.on{display:block}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.fill>.btn{flex:1 1 140px}
.row.between{justify-content:space-between}

.clock-hero{
  font-family:var(--f-mono);font-weight:500;font-size:clamp(68px,25vw,120px);line-height:1;
  letter-spacing:-.04em;color:var(--lamp);font-variant-numeric:tabular-nums;
  animation:flicker 1.4s linear 1;
}
.clock-hero .c{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes flicker{0%{opacity:.1}6%{opacity:1}10%{opacity:.2}14%{opacity:1}38%{opacity:1}41%{opacity:.25}44%{opacity:1}100%{opacity:1}}

.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vw,48px);line-height:1.02;text-wrap:balance}
.h1 em,.h2 em{font-weight:500;font-style:italic}
.h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;text-wrap:balance}
.lead{color:var(--muted);max-width:65ch}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--blood)}

.field{display:flex;flex-direction:column;gap:8px}
.field input{
  width:100%;min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--night-2);color:var(--text);
  font-family:var(--f-mono);font-size:34px;letter-spacing:.35em;text-align:center;padding:8px 8px 8px calc(8px + .35em);
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--night-3);color:var(--text);
  font-weight:600;text-align:center;line-height:1.2;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--blood-bg);border-color:var(--blood);color:var(--blood)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-align:left}

.tag{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  padding:14px 16px 14px 52px;min-height:72px;background:var(--night-2);border:1px solid var(--line);border-radius:14px;
}
.tag::before{content:"";position:absolute;left:18px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--night);border:2px solid var(--line)}
.tag .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tag .nm{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1}
.tag .ti{font-size:14px;color:var(--muted)}
.tag .lb{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.tag[aria-pressed="true"]{border-color:var(--lamp);background:var(--night-3)}
.tag[aria-pressed="true"]::before{background:var(--lamp);border-color:var(--lamp)}
.tag[aria-pressed="true"] .lb{color:var(--lamp)}

.role{border-radius:14px;padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:2px}
.role.ok,.verdict.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.role.bad,.verdict.bad{background:var(--blood-bg);border-color:var(--blood);color:var(--blood)}
.role b,.verdict b{font-family:var(--f-display);font-size:28px;line-height:1.1}
.role span,.verdict span{font-size:15px;color:var(--text)}
.verdict{border-radius:16px;border:1px solid;padding:18px;display:flex;flex-direction:column;gap:6px}

.sheet{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(244,194,91,.09),transparent 160px),var(--night-2)}
.sec{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sec.head{border-top:0;padding-top:18px;gap:2px}

.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.track button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--night-2);font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.track button.past{color:var(--text);border-color:var(--muted)}
.track button[aria-current="step"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);font-weight:500}

.evidence{border:1px dashed var(--lamp);border-radius:14px;padding:16px;background:rgba(244,194,91,.06);display:flex;flex-direction:column;gap:8px}
.evidence .eyebrow{color:var(--lamp)}
.evidence p{font-size:17px}

.timer{border:1px solid var(--line);border-radius:16px;background:var(--night-2);padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.time{font-family:var(--f-mono);font-size:clamp(56px,20vw,84px);font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--night-3);width:100%;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--lamp)}
.timer.done .time{color:var(--blood)}
.timer.flash{animation:alarm .5s steps(2) 5}
@keyframes alarm{50%{background:var(--blood-bg)}}

.bignum{font-family:var(--f-display);font-weight:700;font-size:clamp(120px,40vw,200px);line-height:1;text-align:center;color:var(--lamp);padding-block:16px}
.bignum.word{font-size:clamp(48px,16vw,80px)}

.confirm{border:1px solid var(--blood);background:var(--blood-bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}

.rule{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.rule h3{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.15}
.rule ul,.rule ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.rule ul{list-style:disc}
.rule ol{list-style:decimal}
.rule li::marker{color:var(--muted)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set .ctl{display:flex;align-items:center;gap:10px}
.set .val{font-family:var(--f-mono);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ctl .btn{min-width:44px;padding:8px}

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--night-2);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:6px 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--lamp);background:var(--night-3)}

.toast{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:528px;margin-inline:auto;background:var(--lamp);color:var(--lamp-ink);font-weight:600;border-radius:12px;padding:12px 16px;text-align:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand">Murder party</div>
    <div class="gametag" id="gametag"></div>
  </header>
  <main>
    <section class="tab" id="tab-fiche"></section>
    <section class="tab" id="tab-enquete"></section>
    <section class="tab" id="tab-vote"></section>
    <section class="tab" id="tab-regles"></section>
  </main>
</div>

<nav class="tabs" id="nav" aria-label="Sections">
  <button data-act="go" data-t="fiche"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.6-1.5 1.7-2 2.5-2s1.9.5 2.5 2M14 10h4M14 13h3"/></svg>Ma fiche</button>
  <button data-act="go" data-t="enquete"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg>Enquête</button>
  <button data-act="go" data-t="vote"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8 5.7-5.8"/></svg>Vote</button>
  <button data-act="go" data-t="regles"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M8 8h7M8 12h7"/></svg>Règles</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};

/* ---------- Les trois histoires ----------
   Le premier chiffre du code choisit l’histoire (1, 2 ou 3).
   Le reste du code désigne le coupable (a, b ou c). */
var IDS=['a','b','c'];

var STORIES=[
/* ===== 1. LE BORÉAL ===== */
{n:1,title:'Le Boréal',tagline:'Train de nuit · diamant volé',time:'02:15',timeAria:'2 heures 15',
 win:'02:10 à 02:25',window:'pendant le tunnel, de 2 h 10 à 2 h 25',
 victim:'le baron Hugo de Vaucelles',victimLien:'le baron',
 scene:'Cette nuit, le train de nuit Boréal file de Paris vers Vienne. À 2 h 10, il s’engouffre dans un long tunnel : l’électricité saute dans tous les wagons, quinze minutes de noir total. À 2 h 25, quand la lumière revient, on découvre le baron Hugo de Vaucelles, collectionneur de bijoux, mort dans sa cabine n°7, frappé avec un pied de lampe en laiton. Son coffret est ouvert et le diamant « l’Aurore » a disparu. Le train ne s’arrête qu’à Vienne : le coupable est l’un d’entre vous trois.',
 clue1:'La montre du baron, brisée dans sa chute, s’est arrêtée à 2 h 15, en plein tunnel. La porte de la cabine n’a pas été forcée et le coffret a été ouvert avec la petite clé du baron, sans effraction.',
 CH:{
  a:{name:'Lucien Marchetti',title:'Contrôleur du train',tag:'Contrôleur',fem:false,
    lien:'Tu es criblé de dettes : tu dois 20 000 € à des gens peu aimables. Tout le train parle du diamant « l’Aurore » que le baron transporte dans son coffret.',
    alibi:'« Pendant le tunnel, j’étais en tête de train, je vérifiais les portes et les fusibles. »',
    secret:'Vers 2 h 18, épuisé, tu t’es assoupi sur la banquette de la cabine du personnel jusqu’à la fin du tunnel, ce qui est strictement interdit en service.'},
  b:{name:'Margaux Delorme',title:'Comédienne, cabine 8',tag:'Cabine 8',fem:true,
    lien:'Le diamant « l’Aurore » appartenait à ta famille, avant que le baron le rachète à ta grand-mère pour trois fois rien. Tu comptais le lui reprendre.',
    alibi:'« Je répétais mon texte dans ma cabine, porte fermée. »',
    secret:'Tu voyages avec un chat clandestin, Pompon, strictement interdit à bord. Pendant le tunnel, tu le cachais sous ta couchette pour qu’il ne miaule pas.'},
  c:{name:'Anton Weiss',title:'Chef du wagon-restaurant',tag:'Restaurant',fem:false,
    lien:'Le baron t’avait promis de financer ton restaurant à Vienne. Ce soir, il a annulé devant tout le wagon-restaurant en se moquant de ta cuisine.',
    alibi:'« J’étais au wagon-restaurant, je rangeais la vaisselle dans le noir. »',
    secret:'Peu après 2 h 15, tu t’es enfermé dans la chambre froide du wagon-restaurant pour pleurer de rage en rédigeant ta lettre de démission, que tu n’enverras jamais.'}
 },
 SCN:{
  a:{
   clue2:'Dans le couloir devant la cabine 7 : des traces de graisse noire, celle des essieux. On n’en trouve que dans le local technique, dont seuls le contrôleur et le chef du wagon-restaurant ont la clé.',
   story:'C’est Lucien ! Dès l’entrée dans le tunnel, il a quitté la tête de train, traversé le local technique (la graisse) et ouvert la cabine 7 avec son passe de contrôleur. Le baron l’a surpris, Lucien a saisi le pied de lampe et frappé à 2 h 15. Il a pris la petite clé dans le gilet du baron, ouvert le coffret et caché le diamant dans la boîte à fusibles du wagon.',
   p:{
    a:{did:'À 2 h 10, le tunnel. Tu quittes la tête de train et tu traverses le local technique, de la graisse plein les mains. Avec ton passe de contrôleur, tu entres dans la cabine 7. Le baron te surprend, tu le frappes à 2 h 15 avec le pied de lampe. Tu prends la petite clé dans son gilet, tu ouvres le coffret et tu caches le diamant dans la boîte à fusibles du wagon, que tu connais mieux que personne.',
       plan:'La graisse te désigne, toi ou Anton. Retourne-la contre le chef du wagon-restaurant, qui traverse le local technique pour ses livraisons. Ne parle jamais de ton passe.',
       knows:'Personne ne t’a vu. Seuls risques : Anton, voisin du local technique, et Margaux, qui a pu t’entendre à travers la cloison.'},
    b:{knows:'Pendant le tunnel, à travers la cloison, tu as entendu un passe magnétique dans la serrure de la cabine 7, puis un bruit sourd vers 2 h 15, puis des pas pressés vers l’arrière du train.'},
    c:{knows:'À 2 h 12, depuis la porte du wagon-restaurant, ta lampe a éclairé Lucien qui sortait du local technique, côté queue du train, alors qu’il prétend être resté en tête.'}
   }},
  b:{
   clue2:'Sur le pied de lampe : une fine poudre blanche, farine ou poudre de maquillage, impossible à dire. Seuls la comédienne et le chef du wagon-restaurant en ont sur eux.',
   story:'C’est Margaux ! Le baron lui avait donné rendez-vous dans sa cabine pendant le tunnel « pour parler du diamant ». Il s’est moqué d’elle et a refusé de le rendre. À 2 h 15, elle a saisi le pied de lampe et frappé. Elle a pris la petite clé dans son gilet, ouvert le coffret et caché le diamant dans la caisse de transport de son chat clandestin.',
   p:{
    b:{did:'Le baron t’avait proposé de passer dans sa cabine pendant le tunnel « pour parler du diamant ». À 2 h 10, tu y vas par le couloir. Il refuse encore de te rendre le diamant de ta famille et se moque de toi. À 2 h 15, tu le frappes avec le pied de lampe. Tu prends la petite clé dans son gilet, tu ouvres le coffret et tu caches le diamant dans la caisse de ton chat clandestin.',
       plan:'La poudre blanche te désigne, toi ou Anton. Joue la comédienne : accuse le chef, avec beaucoup de nuances.',
       knows:'Lucien a pu te croiser dans le couloir, et Anton a peut-être entendu le baron te donner rendez-vous.'},
    a:{knows:'À 2 h 12, en faisant ta ronde, ta lampe a éclairé Margaux qui sortait de sa cabine 8 pour aller frapper à la 7, alors qu’elle jure être restée enfermée.'},
    c:{knows:'À 1 h 50, au wagon-restaurant, tu as entendu le baron glisser à Margaux : « Passez me voir dans ma cabine pendant le tunnel, on parlera de votre précieux diamant. »'}
   }},
  c:{
   clue2:'Sur la moquette de la cabine 7 : des éclats d’un verre à champagne brisé et une odeur de champagne. Seuls le chef du wagon-restaurant et le contrôleur assurent le service de nuit.',
   story:'C’est Anton ! Le baron lui avait fait monter une bouteille « pour enterrer la hache de guerre ». Dans le noir, il l’a de nouveau ridiculisé. À 2 h 15, Anton a frappé avec le pied de lampe, pris la petite clé dans le gilet du baron, ouvert le coffret et caché le diamant dans un sac de farine du wagon-restaurant.',
   p:{
    c:{did:'Le baron t’avait fait monter une bouteille de champagne en cabine à 2 h 10 « pour enterrer la hache de guerre ». Dans le noir, il t’a de nouveau ridiculisé. À 2 h 15, tu l’as frappé avec le pied de lampe, un verre se brisant sur la moquette. Tu as pris la petite clé dans son gilet, ouvert le coffret et caché le diamant dans un sac de farine du wagon-restaurant.',
       plan:'Le verre brisé te désigne, toi ou Lucien, qui assure aussi le service de nuit. Accuse-le : son passe ouvre toutes les cabines. Ne parle jamais de la bouteille.',
       knows:'Lucien a pu t’apercevoir dans le couloir avec ton plateau, et Margaux a peut-être entendu un verre se briser derrière la cloison.'},
    a:{knows:'À 2 h 12, ta lampe a éclairé Anton dans le couloir des cabines, un plateau à la main, alors qu’il prétend n’avoir pas quitté le wagon-restaurant.'},
    b:{knows:'Vers 2 h 15, à travers la cloison, tu as entendu un verre se briser, puis une voix d’homme crier : « Un cuisinier ne sera jamais qu’un cuisinier ! », puis un bruit sourd.'}
   }}
 }},

/* ===== 2. LA NOCE MAUDITE ===== */
{n:2,title:'La Noce maudite',tagline:'Mariage · feu d’artifice · testament volé',time:'00:15',timeAria:'minuit 15',
 win:'00:10 à 00:25',window:'pendant la coupure, de 0 h 10 à 0 h 25',
 victim:'Tonton Gérard Pinchon',victimLien:'Tonton Gérard',
 scene:'Minuit au château de Roquefeuil. Le mariage de Prune et Léo bat son plein quand, à 0 h 10, le feu d’artifice fait sauter les plombs : quinze minutes d’obscurité totale. À 0 h 25, quand la lumière revient, on découvre Tonton Gérard Pinchon, l’oncle richissime, mort dans la salle des cadeaux, frappé avec un magnum de champagne. Quelques minutes plus tôt, il avait annoncé au micro qu’il réécrivait son testament lundi. L’enveloppe de ce nouveau testament a disparu. Le château est isolé : le coupable est l’un d’entre vous trois.',
 clue1:'La montre de Tonton Gérard, brisée dans sa chute, s’est arrêtée à 0 h 15, en pleine coupure. La porte de la salle des cadeaux n’a pas été forcée et rien n’a été cassé, à part le magnum.',
 CH:{
  a:{name:'Prune Maréchal',title:'La mariée',tag:'Mariée',fem:true,

    alibi:'« J’étais dans la suite nuptiale, je recousais ma robe déchirée. »',
    secret:'Dans la suite nuptiale, tu écrivais en cachette un message à ton ex, en doutant de ton mariage. Tu ne l’as finalement pas envoyé.'},
  b:{name:'Bastien Roy',title:'Le témoin du marié',tag:'Témoin',fem:false,
    lien:'Tu dois 8 000 € à Tonton Gérard. Son nouveau testament devait t’obliger à les rembourser dès lundi.',
    alibi:'« J’étais dans le jardin avec les invités, devant le feu d’artifice. »',
    secret:'Tu as perdu l’alliance de Léo, que tu devais garder, et tu l’as cherchée à quatre pattes dans l’herbe pendant tout le feu d’artifice.'},
  c:{name:'Solène Aubry',title:'La wedding planner',tag:'Organisation',fem:true,
    lien:'Tonton Gérard refuse de payer ta facture de 40 000 € et menace de ruiner ta réputation. L’enveloppe contient aussi sa lettre de refus.',

    secret:'Vers 0 h 20, tu t’es réfugiée aux toilettes pour pleurer de fatigue en mangeant des petits-fours en cachette.'}
 },

  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}

}

    '<div class="role '+(isC?'bad':'ok')+'"><b>'+(isC?'Coupable':'Innocent'+e)+'</b><span>'+(isC?'Tu as tué '+st.victim+'. Tu peux mentir sur tout, sauf sur les indices révélés à tous.':'Tu dis la vérité sur le crime. Tu peux seulement garder ton secret pour toi.')+'</span></div>'+
    '<article class="sheet"><div class="sec head"><h2 class="h2">'+c.name+'</h2><p class="muted">'+c.title+'</p></div>'+
    secs.map(function(s){return '<div class="sec"><p class="eyebrow">'+s[0]+'</p><p>'+s[1]+'</p></div>';}).join('')+
    '</article>'+
    '<button class="btn primary block" data-act="dark">J’ai tout lu, éteindre la lampe</button>'+
  '</div>';
}

function renderFiche(){
  var h;
  if(!S.code) h=setupHTML();
  else if(!S.me) h=pickHTML();
  else if(!ui.lit) h=lockHTML();
  else h=sheetHTML();
  $('#tab-fiche').innerHTML=h;
}

/* ---------- Onglet Enquête + minuteur ---------- */
var timers={};
function tget(i){
  var k=STEPS[i].dur;
  if(!k) return null;
  if(!timers[i]){var t=S.dur[k]*60;timers[i]={total:t,left:t,running:false,end:0,done:false};}
  return timers[i];
}
function fmt(s){var m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');}

var ac=null;
function audioInit(){
  try{
    if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}
    if(ac&&ac.state==='suspended')ac.resume();
  }catch(e){}
}
function beep(n){
  try{
    if(!ac)return;
    for(var k=0;k<n;k++){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=880;o.connect(g);g.connect(ac.destination);
      var t=ac.currentTime+k*0.35;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.start(t);o.stop(t+0.3);
    }
  }catch(e){}
}
function toast(msg){
  var t=$('#toast');
  t.textContent=msg;t.hidden=false;
  clearTimeout(toast.h);
  toast.h=setTimeout(function(){t.hidden=true;},6000);
}
function alarm(i){
  beep(3);
  try{if(navigator.vibrate)navigator.vibrate([250,120,250]);}catch(e){}
  toast('Temps écoulé : '+STEPS[i].title);
  var box=$('#timer');
  if(box&&S.step===i){box.classList.add('flash');setTimeout(function(){box.classList.remove('flash');},2800);}
}
function updateTimerUI(){
  var t=tget(S.step),box=$('#timer');
  if(!t||!box)return;
  $('#time').textContent=fmt(t.left);
  $('#barfill').style.width=(t.total?100*t.left/t.total:0)+'%';
  box.classList.toggle('done',t.done);
  var bt=$('#tbtn');
  if(bt)bt.textContent=t.running?'Pause':(t.done?'Relancer':(t.left<t.total?'Reprendre':'Lancer'));
}
function tick(){
  var now=Date.now();
  Object.keys(timers).forEach(function(k){
    var t=timers[k];
    if(t.running){
      t.left=Math.max(0,Math.ceil((t.end-now)/1000));
      if(t.left<=0){t.running=false;t.done=true;alarm(+k);}
    }
  });
  updateTimerUI();
}
function tstart(){
  var t=tget(S.step);
  if(!t)return;
  if(t.running){
    t.left=Math.max(0,Math.ceil((t.end-Date.now())/1000));
    t.running=false;
  }else{
    if(t.left<=0){t.left=t.total;}
    t.done=false;t.end=Date.now()+t.left*1000;t.running=true;audioInit();
  }
  updateTimerUI();
}
function treset(){
  var t=tget(S.step);
  if(!t)return;
  t.running=false;t.done=false;t.left=t.total;updateTimerUI();
}

function hintFor(st){
  if(st.id==='alibis'){
    var s=ST();
    return 'Chacun raconte où il était '+(s?s.window:'au moment du crime')+'. Les autres peuvent interrompre.';
  }
  return st.hint;
}

function revealHTML(st){
  var k=st.clue;
  if(!k)return '';
  var label=k==='scene'?'Lire la scène du crime':(k==='c1'?'Révéler le premier indice':'Révéler le second indice');
  if(!S.code)return '<p class="note">Entre d’abord le code de partie dans l’onglet Ma fiche : la scène et les indices dépendent de l’histoire.</p>';
  if(!S.seen[k])return '<button class="btn block" data-act="reveal" data-k="'+k+'">'+label+'</button>';
  var s=ST(),head,text;
  if(k==='scene'){head='Scène du crime · '+s.win;text=s.scene;}
  else if(k==='c1'){head='Pièce n°1 · '+s.time;text=s.clue1;}
  else{head='Pièce n°2';text=s.SCN[culprit()].clue2;}
  return '<div class="evidence"><p class="eyebrow">'+head+'</p><p>'+text+'</p></div>';
}

function renderEnquete(){
  var i=S.step,st=STEPS[i];
  var track=STEPS.map(function(s,j){
    return '<button data-act="jump" data-i="'+j+'" aria-label="Étape '+(j+1)+' : '+s.title+'"'+(j===i?' aria-current="step"':'')+(j<i?' class="past"':'')+'>'+(j+1)+'</button>';
  }).join('');
  var t=tget(i);
  var timer=t?'<div class="timer" id="timer"><div class="time" id="time" role="timer">'+fmt(t.left)+'</div><div class="bar"><i id="barfill"></i></div><div class="row fill" style="width:100%"><button class="btn primary" id="tbtn" data-act="tstart">Lancer</button><button class="btn ghost" data-act="treset">Remettre à zéro</button></div></div>':'';
  var nav=(i<STEPS.length-1)
    ?'<button class="btn primary" data-act="next">Étape suivante</button>'
    :'<button class="btn primary" data-act="go" data-t="vote">Passer au vote</button>';
  $('#tab-enquete').innerHTML='<div class="stack">'+
    '<div class="track" role="group" aria-label="Étapes de la partie">'+track+'</div>'+
    '<div class="stack-s"><p class="eyebrow">Étape '+(i+1)+' sur '+STEPS.length+'</p><h2 class="h2">'+st.title+'</h2></div>'+
    '<p class="lead">'+hintFor(st)+'</p>'+
    revealHTML(st)+timer+
    '<div class="row fill"><button class="btn" data-act="prev"'+(i===0?' disabled':'')+'>Précédent</button>'+nav+'</div>'+
    '<p class="note">Un seul téléphone suffit pour servir de table : on y lit la scène, les indices et on lance le minuteur.</p>'+
  '</div>';
  updateTimerUI();
}

/* ---------- Onglet Vote ---------- */
function startCount(){
  ui.vote='count';ui.n=3;renderVote();
  var step=function(){
    ui.n--;
    try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}
    if(ui.n<0){ui.vote='pick';renderVote();return;}
    renderVote();
    setTimeout(step,ui.n===0?1600:900);
  };
  setTimeout(step,900);
}

function renderVote(){
  var el=$('#tab-vote'),h;
  if(!S.code){
    el.innerHTML='<div class="stack"><h2 class="h2">Le vote</h2><p class="lead">Entre d’abord le code de partie dans l’onglet Ma fiche.</p></div>';
    return;
  }
  var st=ST(),cu=culprit();
  if(S.verdict){
    var win=S.pick===cu;
    var line;
    if(win)line='Le groupe a désigné '+st.CH[cu].name+', et c’était bien le coupable.';
    else if(S.pick==='none')line='Personne n’a réuni deux doigts. Le coupable s’en sort.';
    else line='Le groupe a désigné '+st.CH[S.pick].name+', qui est innocent'+(st.CH[S.pick].fem?'e':'')+'. Le coupable court toujours.';
    h='<div class="stack">'+
      '<div class="verdict '+(win?'ok':'bad')+'"><b>'+(win?'Les innocents gagnent':'Le coupable gagne')+'</b><span>'+line+'</span></div>'+
      '<div class="stack-s"><p class="eyebrow">Le coupable</p><h2 class="h2">'+st.CH[cu].name+'</h2></div>'+
      '<div class="evidence"><p class="eyebrow">Ce qui s’est vraiment passé</p><p>'+st.SCN[cu].story+'</p></div>'+
      '<button class="btn primary block" data-act="newgame">Nouvelle partie</button>'+
    '</div>';
  }else if(S.pick){
    var who=S.pick==='none'?'Personne (trois doigts différents)':st.CH[S.pick].name;
    h='<div class="stack">'+
      '<div class="stack-s"><p class="eyebrow">Vote enregistré</p><h2 class="h2">Le groupe désigne : <em>'+who+'</em></h2></div>'+
      '<p class="lead">Tout le monde est d’accord sur ce résultat ? La vérité s’affichera ensuite, sans retour possible.</p>'+
      '<button class="btn primary block" data-act="ask" data-what="reveal">Révéler la vérité</button>'+
      confirmBox('reveal','Dernière chance de changer d’avis : la solution va s’afficher sur ce téléphone.','Oui, révéler','vreveal')+
      '<button class="link" data-act="vchange">Changer le résultat du vote</button>'+
    '</div>';
  }else if(ui.vote==='count'){
    h='<div class="stack"><p class="eyebrow" style="text-align:center">Tenez vos doigts prêts</p><div class="bignum'+(ui.n>0?'':' word')+'" aria-live="assertive">'+(ui.n>0?ui.n:'Pointez !')+'</div></div>';
  }else if(ui.vote==='pick'){
    var tags=IDS.map(function(id){var c=st.CH[id];return '<button class="tag" data-act="vpick" data-id="'+id+'" aria-pressed="false"><span class="tx"><span class="nm">'+c.name+'</span><span class="ti">'+c.title+'</span></span><span class="lb">'+c.tag+'</span></button>';}).join('');
    tags+='<button class="tag" data-act="vpick" data-id="none" aria-pressed="false"><span class="tx"><span class="nm">Personne</span><span class="ti">Trois doigts, trois suspects différents</span></span></button>';
    h='<div class="stack"><div class="stack-s"><p class="eyebrow">Résultat du vote</p><h2 class="h2">Qui a reçu au moins deux doigts ?</h2></div><div class="stack-s">'+tags+'</div></div>';
  }else{
    h='<div class="stack">'+
      '<div class="stack-s"><p class="eyebrow">Fin de l’enquête</p><h2 class="h2">Le vote</h2></div>'+
      '<p class="lead">Quand la discussion est finie, comptez jusqu’à trois. À « Pointez ! », chacun désigne un suspect du doigt, le coupable aussi.</p>'+
      '<button class="btn primary block" data-act="vstart">Lancer le 3, 2, 1</button>'+
    '</div>';
  }
  el.innerHTML=h;
}

/* ---------- Onglet Règles ---------- */
function renderRegles(){
  var d=S.dur,st=ST();
  var sets=Object.keys(DUR_LABELS).map(function(k){
    return '<div class="set"><span>'+DUR_LABELS[k]+'</span><span class="ctl"><button class="btn small" data-act="dur" data-k="'+k+'" data-d="-1" aria-label="Moins une minute : '+DUR_LABELS[k]+'">−</button><span class="val">'+d[k]+' min</span><button class="btn small" data-act="dur" data-k="'+k+'" data-d="1" aria-label="Plus une minute : '+DUR_LABELS[k]+'">+</button></span></div>';
  }).join('');
  var vict=st?'La victime, '+st.victim+', n’est pas jouée. Vous êtes les trois suspects.':'La victime n’est pas jouée. Vous êtes les trois suspects.';
  $('#tab-regles').innerHTML='<div class="stack">'+
    '<div class="stack-s"><p class="eyebrow">Version 2</p><h2 class="h2">Règles du jeu</h2></div>'+
    '<section class="rule"><h3>Mise en place</h3><ul>'+
      '<li>'+vict+'</li>'+
      '<li>Le premier chiffre du code choisit l’histoire. Le reste du code désigne le coupable en secret : lui seul le sait.</li>'+
      '<li>Chaque fiche donne : ton lien avec la victime, ton alibi officiel, ce que tu caches et ce que tu sais.</li>'+
    '</ul></section>'+
    '<section class="rule"><h3>Déroulé</h3><ol>'+
      '<li>Scène du crime, lue à voix haute.</li>'+
      '<li>Lecture des fiches en privé ('+d.fiches+' min).</li>'+
      '<li>Manche 1, les alibis ('+d.alibis+' min).</li>'+
      '<li>Manche 2, premier indice, puis deux questions de chacun à chacun des deux autres ('+d.indice1+' min).</li>'+
      '<li>Manche 3, second indice et discussion libre ('+d.indice2+' min).</li>'+
      '<li>Vote : 3, 2, 1, tout le monde pointe un suspect.</li>'+
      '<li>Révélation du coupable et de l’histoire vraie.</li>'+
    '</ol></section>'+
    '<section class="rule"><h3>Mensonges</h3><ul>'+
      '<li>Les innocents disent la vérité sur le crime, mais peuvent garder leur secret.</li>'+
      '<li>Le coupable peut mentir sur tout, sauf sur les indices révélés à tous.</li>'+
    '</ul></section>'+
    '<section class="rule"><h3>Victoire</h3><ul>'+
      '<li>Les innocents gagnent si au moins deux doigts désignent le coupable.</li>'+
      '<li>Sinon, le coupable gagne.</li>'+
    '</ul></section>'+
    '<section class="rule"><h3>Comment jouer</h3><ul>'+
      '<li>Chacun ouvre le site sur son téléphone, entre le même code et choisit un personnage différent.</li>'+
      '<li>Un seul téléphone pour trois ? Même chose, en le passant de main en main. Éteignez la lampe avant de le passer.</li>'+
    '</ul></section>'+
    '<section class="rule"><h3>Régler la durée des manches</h3><div>'+sets+'</div></section>'+
    '<section class="rule"><h3>Nouvelle partie</h3>'+
      '<button class="btn block" data-act="ask" data-what="newgame">Repartir de zéro sur ce téléphone</button>'+
      confirmBox('newgame','Le code, le personnage et les indices révélés seront effacés sur ce téléphone.','Oui, repartir','newgame')+
    '</section>'+
  '</div>';
}

/* ---------- Rendu général ---------- */
var TABS=['fiche','enquete','vote','regles'];
function curTab(){var h=location.hash.replace('#','');return TABS.indexOf(h)>=0?h:'fiche';}
function showTab(){
  var t=curTab();
  TABS.forEach(function(x){$('#tab-'+x).classList.toggle('on',x===t);});
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){
    if(b.dataset.t===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,0);
}
function renderAll(){
  var st=ST();
  $('#brand').textContent=st?st.title:'Murder party';
  $('#gametag').textContent=S.code?'Partie n° '+S.code:'';
  renderFiche();renderEnquete();renderVote();renderRegles();
}
function newGame(){
  var dur=S.dur;
  S=clone(DEF);S.dur=dur;
  ui.lit=false;ui.sel=null;ui.confirm=null;ui.err='';ui.vote='idle';ui.mode=null;
  Object.keys(timers).forEach(function(k){delete timers[k];});
  save();renderAll();
  if(curTab()!=='fiche')location.hash='fiche';else window.scrollTo(0,0);
}
function setCode(){
  var i=$('#code'),v=i?i.value:'';
  if(!/^[123]\d{3}$/.test(v)){
    ui.err='Le code compte 4 chiffres et commence par 1, 2 ou 3 (le numéro de l’histoire).';
    renderFiche();var j=$('#code');if(j){j.value=v;$('#codestory').textContent=codeNote(v);j.focus();}
    return;
  }
  ui.err='';ui.mode=null;S.code=v;S.me=null;ui.sel=null;save();renderAll();window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var a=b.dataset.act;
  switch(a){
    case 'go':location.hash=b.dataset.t;break;
    case 'story':{
      var i=$('#code');
      if(i){i.value=gen(+b.dataset.n);$('#codestory').textContent=codeNote(i.value);}
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="story"]'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      break;
    }
    case 'rand':{
      var j=$('#code');
      if(j){j.value=gen();$('#codestory').textContent=codeNote(j.value);}
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="story"]'),function(x){x.setAttribute('aria-pressed',(j&&x.dataset.n===j.value.charAt(0))?'true':'false');});
      break;
    }
    case 'host':ui.mode='host';ui.err='';renderFiche();window.scrollTo(0,0);break;
    case 'join':ui.mode='join';ui.err='';renderFiche();window.scrollTo(0,0);break;
    case 'back':ui.mode=null;ui.err='';renderFiche();break;
    case 'pickstory':{S.code=gen(+b.dataset.n||0);S.me=null;ui.sel=null;ui.mode=null;save();renderAll();window.scrollTo(0,0);break;}
    case 'setcode':setCode();break;
    case 'sel':ui.sel=b.dataset.id;renderFiche();break;
    case 'confirmme':if(ui.sel){S.me=ui.sel;ui.lit=true;save();renderFiche();window.scrollTo(0,0);}break;
    case 'light':ui.lit=true;renderFiche();break;
    case 'dark':ui.lit=false;renderFiche();window.scrollTo(0,0);break;
    case 'ask':ui.confirm=b.dataset.what;renderAll();break;
    case 'cancel':ui.confirm=null;renderAll();break;
    case 'unplay':S.me=null;ui.sel=null;ui.lit=false;ui.confirm=null;save();renderAll();break;
    case 'newgame':newGame();break;
    case 'prev':if(S.step>0){S.step--;save();renderEnquete();}break;
    case 'next':if(S.step<STEPS.length-1){S.step++;save();renderEnquete();window.scrollTo(0,0);}break;
    case 'jump':S.step=+b.dataset.i;save();renderEnquete();break;
    case 'reveal':S.seen[b.dataset.k]=true;save();renderEnquete();break;
    case 'tstart':tstart();break;
    case 'treset':treset();break;
    case 'dur':{
      var k=b.dataset.k,v=Math.min(20,Math.max(1,S.dur[k]+(+b.dataset.d)));
      S.dur[k]=v;save();
      Object.keys(timers).forEach(function(n){if(!timers[n].running)delete timers[n];});
      renderRegles();renderEnquete();break;
    }
    case 'vstart':startCount();break;
    case 'vpick':S.pick=b.dataset.id;save();renderVote();break;
    case 'vchange':S.pick=null;ui.vote='pick';save();renderVote();break;
    case 'vreveal':S.verdict=true;ui.confirm=null;save();renderVote();window.scrollTo(0,0);break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='code'){
    e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
    var n=$('#codestory');if(n)n.textContent=codeNote(e.target.value);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='code'){e.preventDefault();setCode();}
});
window.addEventListener('hashchange',function(){
  ui.confirm=null;
  if(curTab()!=='fiche')ui.lit=false;
  showTab();renderAll();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&ui.lit){ui.lit=false;renderFiche();}
});

showTab();renderAll();
setInterval(tick,250);
})();
</script>
</body>
</html>
